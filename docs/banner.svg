<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 452" width="1200" height="452"
     role="img" aria-labelledby="t d">
  <title id="t">Parsimony — where a 50M-parameter budget goes</title>
  <desc id="d">Five parameter budgets at d_model 512, each one bar. As the vocabulary grows from
  4,096 to 50,257 tokens the embedding table (burgundy) takes 4.3%, 8.8%, 17.2%, 35.0% and 54.1%
  of the budget, and the transformer layers (gold) that fit drop from 15 to 14, 13, 10 and 7.
  The 16,384-token row is the configuration the sweep measured as best.</desc>

  <style>
    :root {
      --bg: #f6f6f8;  --card: #ffffff;  --line: #e7e7ec;  --halo: #f3faf6;
      --ink: #17171b; --muted: #6c6c78; --brand: #7e1620;
      --s1: #a82232;  --s2: #c7832a;    --good: #17794e;  --dot: rgba(126,22,32,.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f13;  --card: #17171c;  --line: #2a2a33;  --halo: #12241c;
        --ink: #f2f2f5; --muted: #9a9aa8; --brand: #e68f99;
        --s1: #c9374a;  --s2: #d99a45;    --good: #3fbf85;  --dot: rgba(230,143,153,.12);
      }
    }
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .wordmark { font-size: 54px; font-weight: 800; letter-spacing: -1.6px; fill: var(--ink); }
    .tagline  { font-size: 21px; font-weight: 500; fill: var(--muted); }
    .kicker   { font-size: 14px; font-weight: 600; letter-spacing: 2.2px; fill: var(--brand); }
    .rowlab   { font-size: 16px; font-weight: 600; fill: var(--ink); }
    .rowmeta  { font-size: 14px; fill: var(--muted); }
    .rowbest  { fill: var(--good); font-weight: 700; }
    .foot     { font-size: 14px; fill: var(--muted); }
    .embed    { fill: var(--s1); }
    .blocks   { fill: var(--s2); }
  </style>

  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="var(--dot)"/>
    </pattern>
    <clipPath id="barclip-1"><rect x="190" y="196" width="740" height="30" rx="6"/></clipPath>
    <clipPath id="barclip-2"><rect x="190" y="236" width="740" height="30" rx="6"/></clipPath>
    <clipPath id="barclip-3"><rect x="190" y="276" width="740" height="30" rx="6"/></clipPath>
    <clipPath id="barclip-4"><rect x="190" y="316" width="740" height="30" rx="6"/></clipPath>
    <clipPath id="barclip-5"><rect x="190" y="356" width="740" height="30" rx="6"/></clipPath>
  </defs>

  <rect width="1200" height="452" rx="16" fill="var(--bg)"/>
  <rect width="1200" height="452" rx="16" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="450.5" rx="15.25" fill="none"
        stroke="var(--line)" stroke-width="1.5"/>

  <!-- masthead -->
  <text class="sans wordmark" x="48" y="92">Parsimony</text>
  <text class="sans tagline"  x="48" y="128">Where should a 50-million-parameter budget go?</text>
  <text class="mono kicker"   x="1152" y="66" text-anchor="end">GIBC V2 · TRACK 01</text>
  <text class="mono rowmeta"  x="1152" y="92" text-anchor="end">cap 50,000,000 — embeddings included</text>
  <text class="mono rowmeta"  x="1152" y="114" text-anchor="end">d_model 512 · SwiGLU · tied embeddings</text>
  <line x1="48" y1="158" x2="1152" y2="158" stroke="var(--line)" stroke-width="1.5"/>

  <!-- the measured-best row, haloed -->
  <rect x="32" y="268" width="1136" height="46" rx="10" fill="var(--halo)"/>

  <!-- vocab 4,096 — embeddings 4.3% -->
  <text class="mono rowlab" x="170" y="217" text-anchor="end">4,096</text>
  <g clip-path="url(#barclip-1)">
    <rect x="190" y="196" width="740" height="30" class="blocks"/>
    <rect x="190" y="196" width="32"  height="30" class="embed"/>
  </g>
  <text class="mono rowmeta" x="948"  y="217">4.3% embed</text>
  <text class="mono rowlab"  x="1152" y="217" text-anchor="end">15 layers</text>

  <!-- vocab 8,192 — embeddings 8.8% -->
  <text class="mono rowlab" x="170" y="257" text-anchor="end">8,192</text>
  <g clip-path="url(#barclip-2)">
    <rect x="190" y="236" width="740" height="30" class="blocks"/>
    <rect x="190" y="236" width="65"  height="30" class="embed"/>
  </g>
  <text class="mono rowmeta" x="948"  y="257">8.8% embed</text>
  <text class="mono rowlab"  x="1152" y="257" text-anchor="end">14 layers</text>

  <!-- vocab 16,384 — embeddings 17.2% — the one the sweep picked -->
  <text class="mono rowlab rowbest" x="170" y="297" text-anchor="end">16,384</text>
  <g clip-path="url(#barclip-3)">
    <rect x="190" y="276" width="740" height="30" class="blocks"/>
    <rect x="190" y="276" width="127" height="30" class="embed"/>
  </g>
  <text class="mono rowmeta rowbest" x="948"  y="297">17.2% embed</text>
  <text class="mono rowlab  rowbest" x="1152" y="297" text-anchor="end">13 layers</text>

  <!-- vocab 32,768 — embeddings 35.0% -->
  <text class="mono rowlab" x="170" y="337" text-anchor="end">32,768</text>
  <g clip-path="url(#barclip-4)">
    <rect x="190" y="316" width="740" height="30" class="blocks"/>
    <rect x="190" y="316" width="259" height="30" class="embed"/>
  </g>
  <text class="mono rowmeta" x="948"  y="337">35.0% embed</text>
  <text class="mono rowlab"  x="1152" y="337" text-anchor="end">10 layers</text>

  <!-- vocab 50,257 (GPT-2) — embeddings 54.1% -->
  <text class="mono rowlab" x="170" y="377" text-anchor="end">50,257</text>
  <g clip-path="url(#barclip-5)">
    <rect x="190" y="356" width="740" height="30" class="blocks"/>
    <rect x="190" y="356" width="400" height="30" class="embed"/>
  </g>
  <text class="mono rowmeta" x="948"  y="377">54.1% embed</text>
  <text class="mono rowlab"  x="1152" y="377" text-anchor="end">7 layers</text>

  <!-- legend -->
  <line x1="48" y1="404" x2="1152" y2="404" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="48" y="424" width="12" height="12" rx="3" class="embed"/>
  <text class="mono foot" x="68" y="435">token embedding table</text>
  <rect x="248" y="424" width="12" height="12" rx="3" class="blocks"/>
  <text class="mono foot" x="268" y="435">transformer layers</text>
  <text class="mono foot" x="1152" y="435" text-anchor="end">each bar is one 50M budget · vocabulary is the only variable</text>
</svg>
